name: phaptang

services:
    laravel.app:
        build:
            context: ./docker/8.2
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: phap-tang-app:prod
        container_name: phap-tang-prod-app
        restart: unless-stopped
        extra_hosts:
            - 'host.docker.internal:host-gateway'
        ports:
            # Port 80 is often occupied on host systems, default to 8090 (customizable via APP_PORT in .env)
            - '${APP_PORT:-8091}:80'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 1
            XDEBUG_MODE: '${SAIL_XDEBUG_MODE:-off}'
            IGNITION_LOCAL_SITES_PATH: '${PWD}'
            APP_ENV: '${APP_ENV:-production}'
            APP_DEBUG: '${APP_DEBUG:-false}'
            DB_HOST: '${DB_HOST:-mysql}'
            DB_PORT: '${DB_PORT:-3306}'
        volumes:
            - '.:/var/www/html'
        networks:
            - sail-prod
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: 'mysql/mysql-server:8.0'
        container_name: phap-tang-prod-mysql
        restart: unless-stopped
        # Port 3306 is not exposed to the host for production security.
        # Services communicate internally over 'sail-prod' on 'mysql:3306'.
        # If external tunnel access is needed, bind only to localhost (127.0.0.1):
        # ports:
        #     - '127.0.0.1:${FORWARD_DB_PORT:-3307}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE:-laravel}'
            MYSQL_USER: '${DB_USERNAME:-sail}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ALLOW_EMPTY_PASSWORD: 1
        volumes:
            - 'sail-mysql-prod:/var/lib/mysql'
            - './vendor/laravel/sail/database/mysql/create-testing-database.sh:/docker-entrypoint-initdb.d/10-create-testing-database.sh'
        networks:
            - sail-prod
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 5
            timeout: 5s
            interval: 10s

    # Optional: Queue Worker container for handling background jobs
    # queue:
    #     image: phap-tang-app:prod
    #     container_name: phap-tang-prod-queue
    #     restart: unless-stopped
    #     extra_hosts:
    #         - 'host.docker.internal:host-gateway'
    #     command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    #     volumes:
    #         - '.:/var/www/html'
    #     networks:
    #         - sail-prod
    #     depends_on:
    #         mysql:
    #             condition: service_healthy

    # Optional: Scheduler container for running scheduled tasks
    # scheduler:
    #     image: phap-tang-app:prod
    #     container_name: phap-tang-prod-scheduler
    #     restart: unless-stopped
    #     extra_hosts:
    #         - 'host.docker.internal:host-gateway'
    #     command: php artisan schedule:work
    #     volumes:
    #         - '.:/var/www/html'
    #     networks:
    #         - sail-prod
    #     depends_on:
    #         mysql:
    #             condition: service_healthy

networks:
    sail-prod:
        driver: bridge

volumes:
    sail-mysql-prod:
        driver: local
