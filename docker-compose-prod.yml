name: phaptang

services:
    laravel.app:
        build:
            context: ./docker/8.2
            dockerfile: Dockerfile
            args:
                WWWGROUP: '${WWWGROUP:-1000}'
        image: phap-tang-app:prod
        restart: unless-stopped
        ports:
            - '${APP_PORT:-80}:80'
        environment:
            WWWUSER: '${WWWUSER:-1000}'
            LARAVEL_SAIL: 0
            APP_ENV: '${APP_ENV:-production}'
            APP_DEBUG: '${APP_DEBUG:-false}'
        volumes:
            - '.:/var/www/html'
        networks:
            - app-network
        depends_on:
            mysql:
                condition: service_healthy

    mysql:
        image: 'mysql/mysql-server:8.0'
        restart: unless-stopped
        # Port 3306 is not exposed to the host/internet for security;
        # Services communicate internally over 'app-network' using hostname 'mysql:3306'.
        # If direct local tunnel access is needed, bind only to localhost:
        # ports:
        #     - '127.0.0.1:${FORWARD_DB_PORT:-3306}:3306'
        environment:
            MYSQL_ROOT_PASSWORD: '${DB_PASSWORD}'
            MYSQL_ROOT_HOST: '%'
            MYSQL_DATABASE: '${DB_DATABASE}'
            MYSQL_USER: '${DB_USERNAME}'
            MYSQL_PASSWORD: '${DB_PASSWORD}'
        volumes:
            - 'prod-mysql:/var/lib/mysql'
        networks:
            - app-network
        healthcheck:
            test:
                - CMD
                - mysqladmin
                - ping
                - '-p${DB_PASSWORD}'
            retries: 5
            timeout: 5s
            interval: 10s

    # Optional: Queue Worker container for handling background jobs
    # queue:
    #     image: phap-tang-app:prod
    #     restart: unless-stopped
    #     command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    #     volumes:
    #         - '.:/var/www/html'
    #     networks:
    #         - app-network
    #     depends_on:
    #         mysql:
    #             condition: service_healthy

    # Optional: Scheduler container for running scheduled tasks
    # scheduler:
    #     image: phap-tang-app:prod
    #     restart: unless-stopped
    #     command: php artisan schedule:work
    #     volumes:
    #         - '.:/var/www/html'
    #     networks:
    #         - app-network
    #     depends_on:
    #         mysql:
    #             condition: service_healthy

networks:
    app-network:
        driver: bridge

volumes:
    prod-mysql:
        driver: local
